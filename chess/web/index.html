<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e5">
  <title>狗哥下象棋 · 家人的棋馆</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="wordmark" href="#home" data-route="home"><span class="seal" aria-hidden="true">棋</span><span>狗哥下象棋<small>家人的棋馆</small></span></a>
      <nav aria-label="主要导航">
        <button data-route="ai" class="nav-item">AI 对战</button>
        <button data-route="lobby" class="nav-item">玩家对战</button>
        <button data-route="settings" class="nav-item">设置</button>
      </nav>
      <button id="profile-button" class="profile-button" data-route="settings" aria-label="个人资料">未登录</button>
    </header>
    <main id="app" aria-live="polite"><div class="loading">正在连接棋馆…</div></main>
    <footer class="site-footer"><span>一盘棋，一家人。</span><span id="connection-label">正在连接</span></footer>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
